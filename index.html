<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Games</title>
<style>
:root{
  --w:480px;

  --color-text:#292929;

  --radius-sm:12px;

  --space-md:16px;
  --space-lg:24px;
  --space-xl:40px;
  --shadow:0 10px 28px rgba(41,41,41,.06);
  --bg:var(--color-bg);
  --fg:var(--color-text);
  --card:var(--color-surface);
  --card2:var(--color-surface);
  --fill:var(--color-bg-secondary);
  --seg:var(--color-bg-secondary);
  --on:var(--color-surface);
  --sep:#e6e0d8;
  --blue:var(--color-primary);
  --ac:#7daa78;
  --bad:#e07a6a;
  --mut:var(--color-text-muted);
  --ink:var(--color-text);
  color-scheme:light
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--color-bg);color:var(--color-text);font-family:ui-rounded,"SF Pro Rounded","Avenir Next","Nunito","PingFang SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column;align-items:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));gap:12px;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;line-height:1.45}
button{font:inherit;cursor:pointer;transition:transform .18s ease,background .18s ease,box-shadow .18s ease,color .18s ease}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--color-primary);outline-offset:3px}
@media (prefers-reduced-motion:reduce){button{transition:none}}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;width:100%;max-width:var(--w);margin-inline:auto;font-size:17px}
.scoreblock{display:flex;flex-direction:column;line-height:1.05;min-width:64px}

.hud{display:flex;align-items:center;gap:8px}
#mode{font-size:15px;color:var(--mut)}

#pause[hidden],#mode[hidden],#hold[hidden]{display:none}
.pips{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;order:3}
.pips[hidden]{display:none}
.pips i{width:12px;height:12px;flex:0 0 12px;border-radius:50%;box-shadow:inset 0 0 0 2px #ddd6cc;background:transparent}
.pips i.hit{background:var(--color-accent);box-shadow:none}
.pips i.bad{background:var(--bad);box-shadow:none}
.pips i.miss{box-shadow:inset 0 0 0 2px var(--bad);background:linear-gradient(var(--bad),var(--bad)) center/8px 2px no-repeat}
#score.down{color:var(--bad)}
#stage{position:relative;flex:1;width:100%;max-width:var(--w);margin-inline:auto;background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden;min-height:240px;box-shadow:var(--shadow)}
.item{position:absolute;left:50%;transform:translateX(-50%);font-size:64px;line-height:1;z-index:0}
.pop{position:absolute;right:12px;z-index:1;font-size:18px;font-weight:700;line-height:1.2;pointer-events:none;padding:6px 12px;border-radius:var(--radius-pill);background:var(--color-surface);box-shadow:var(--shadow);animation:rise .9s ease forwards}
.pop.hit{color:var(--ac)}.pop.bad{color:var(--bad)}.pop.miss{color:var(--mut)}
@keyframes rise{0%{opacity:1;transform:translateY(0)}40%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-28px)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
#overlay,#hold{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;text-align:center}
#overlay{z-index:3;background:var(--card);padding:0;overflow:hidden;justify-content:safe center;gap:0}
#overlay .sheet{flex:0 1 auto;min-height:0;width:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:20px;padding:28px 20px 8px}
#overlay #go{flex:none;margin:8px 16px 16px}
#hold{z-index:2;background:color-mix(in srgb,var(--card) 72%,transparent)}
#hold .panel{background:var(--color-surface);border-radius:var(--radius-lg);padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:var(--shadow)}
#overlay p,#hold p{color:var(--mut);margin:0;font-size:17px;line-height:1.5;max-width:32ch}
#big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.field{display:flex;flex-direction:column;align-items:center;gap:8px}
.lbl{font-size:14px;font-weight:650;color:var(--mut)}
.row{display:flex;gap:16px;width:100%;max-width:var(--w);margin-inline:auto}
body:not(.playing) .arrow{visibility:hidden}
.arrow{flex:1;border:0;border-radius:var(--radius-lg);background:var(--color-surface);color:var(--fg);padding:20px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow)}
.arrow .ic{font-size:36px;line-height:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px}
.arrow .ic span{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:4px;border-radius:var(--radius-sm);background:var(--color-bg-secondary)}
.arrow .ar{line-height:0;color:var(--color-primary);display:flex}
.arrow .ar svg{width:44px;height:44px;display:block}

.arrow.ok .ar{color:#5f8f5c}.arrow.no .ar{color:var(--color-primary)}
button.s{border:0;border-radius:var(--radius-pill);padding:14px 32px;min-height:52px;min-width:160px;background:var(--color-primary);color:#fff;font-size:17px;font-weight:700}
button.s:active{background:var(--color-primary-press)}
.lv{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:4px;border-radius:var(--radius-pill);background:var(--color-bg-secondary);width:min(100%,320px)}
.lv button{border:0;border-radius:var(--radius-pill);padding:8px 14px;min-height:40px;background:transparent;color:var(--fg);font-size:15px;font-weight:700;line-height:1.2;flex:1 1 auto}
.lv button.on{background:var(--color-surface);color:var(--fg);box-shadow:0 2px 8px rgba(41,41,41,.08)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (min-width:700px){:root{--w:640px}}
body{height:100dvh;max-height:100dvh;overflow:hidden}
#stage{min-height:min(240px,34dvh)}
@media (max-width:420px){
 .top{font-size:16px}

}
#picker{width:100%;max-width:var(--w);margin-inline:auto;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0;text-align:left;padding:8px 4px 32px}
#picker h1{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
.lead{margin:8px 2px 28px;color:var(--color-text-muted);font-size:17px;line-height:1.5}

button.pick+button.pick{box-shadow:inset 0 1px 0 var(--sep)}
.pick-copy{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}

.pick-desc{font-size:15px;line-height:1.4;color:var(--color-text-muted)}
.art{width:64px;height:64px;border-radius:var(--radius-md);flex:none;display:block;overflow:hidden;background:var(--color-bg)}

.pill{margin-left:auto;flex:none;min-width:84px;height:40px;padding:0 18px;border-radius:var(--radius-pill);background:var(--color-primary);color:#fff;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

#games:hover,#mem-games:hover,#games:focus-visible,#mem-games:focus-visible{color:var(--color-primary)}
#fall{display:contents}
body:not(.fall) #fall,body:not(.pick) #picker,body:not(.mem) #mem{display:none}
#mem{width:min(100%,480px);margin-inline:auto;flex:1;min-height:0;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:4px 0 8px;overflow:auto;--cell:#f5f1ea;--lit:#f7d774;--ok:#a8c9a0;--bad:#e7a196;--btn:var(--color-primary)}
#mem-side{display:contents}

#mem .bar{display:flex;gap:8px 14px;font-size:15px;font-weight:600;color:var(--mut);margin:0;flex-wrap:wrap;justify-content:flex-start;align-items:center;width:100%;order:1}
#mem-msg{min-height:28px;font-size:18px;font-weight:600;line-height:1.4;margin:0;text-align:left;align-self:flex-start;width:100%;order:1}

#mem-grid{display:grid;gap:clamp(6px,2.4cqmin,12px);width:min(100cqw,100cqh,420px);height:min(100cqw,100cqh,420px)}
#mem-grid.big{gap:clamp(4px,1.6cqmin,9px)}
#mem .c{background:var(--color-surface);border:0;border-radius:clamp(12px,22%,18px);box-shadow:0 6px 16px rgba(41,41,41,.05);transition:background .2s ease,transform .18s ease;cursor:pointer}
#mem .c.lit{background:var(--lit)}#mem .c.ok{background:var(--ok)}#mem .c.bad{background:var(--bad)}
#mem .c:focus-visible{outline:3px solid var(--lit);outline-offset:3px}
#mem-timer{width:48px;height:48px;border-radius:50%;background:var(--color-secondary);color:var(--color-text);font-size:22px;font-weight:700;display:none;align-items:center;justify-content:center;flex:none}
#mem-trophy{display:none;font-size:48px;line-height:1;margin:0;order:3;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0}to{opacity:1}}
#mem-overlay{position:fixed;inset:0;z-index:50;background:rgba(255,249,242,.94);display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
#mem-overlay.show{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#mem-bigtrophy{font-size:72px;line-height:1;animation:pop .25s ease-out}
#mem-ovtext{color:var(--fg);font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:12px;text-align:center}
#mem-ovsub{color:var(--mut);font-size:16px;margin-top:8px}
#mem .conf{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#mem-final{font-size:clamp(16px,4vw,24px);font-weight:700;margin:0;text-align:center;order:3}
#mem-final:empty{display:none}
#mem .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0;order:3}
#mem button.go{background:var(--btn);color:#fff;border:0;border-radius:var(--radius-pill);font-size:17px;font-weight:700;padding:14px 32px;min-height:52px;min-width:160px}
#mem button.go:active{background:var(--color-primary-press)}
#mem button.go.alt{background:var(--color-bg-secondary);color:var(--color-text)}
@media (prefers-reduced-motion:reduce){
 #mem-trophy,#mem-bigtrophy,#mem .conf,#mem-overlay{animation:none}
 #mem .c{transition:none}
}
body.mem{height:100dvh;max-height:100dvh;overflow:hidden}
@media (min-height:720px){
 .store-list{background:transparent;overflow:visible;box-shadow:none;display:flex;flex-direction:column;gap:20px}
 button.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px;row-gap:4px;min-height:0;padding:16px;border-radius:24px;background:var(--color-surface);box-shadow:var(--shadow)}
 button.pick+button.pick{box-shadow:var(--shadow)}
 .pick-copy{display:contents}
 .pick-name{grid-area:2 / 1 / 3 / -1;font-size:22px}
 .pick-desc{grid-area:3 / 1 / 4 / 2;font-size:16px;line-height:1.45;max-width:34ch}
 button.pick .art{grid-area:1 / 1 / 2 / -1;width:100%;height:200px;margin-bottom:12px;border-radius:var(--radius-md)}
 button.pick .art img{object-position:center}
 button.pick .pill{grid-area:3 / 2 / 4 / 3;margin:0;align-self:center}
}
@media (max-height:420px){
 body{padding:6px;gap:6px}
 #picker{padding:0}

 button.pick{padding:8px 10px;min-height:0}
}
@media (orientation:landscape) and (max-height:560px){
 body.mem #mem{width:100%;max-width:none;display:grid;grid-template-columns:minmax(148px,34%) minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-items:stretch;gap:8px 12px;padding:0}
 body.mem #mem-side{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:8px;min-width:0;min-height:0;overflow:auto;grid-column:1;grid-row:1}
 body.mem #mem .bar,body.mem #mem h1,body.mem #mem-msg,body.mem #mem-trophy,body.mem #mem-final,body.mem #mem .btns{order:0;width:auto;max-width:100%;justify-content:flex-start;text-align:left}
 body.mem #mem h1{font-size:18px}

@media (max-height:680px){

<script>
const $=id=>document.getElementById(id);
const PAIRS=[['🍎','🍌','🐶','🐱'],['🚗','🚌','🌻','🌳'],['🍓','🍇','🐸','🐘'],['🍕','🍩','🚲','🚂'],['⭐','🌙','🍄','🌷'],['🦋','🐝','🍒','🥕']];
let lastPair=-1;
const LEVELS={'Slow':12.9,'Medium':10,'Fast':7.1}; // seconds to fall
const calm=matchMedia('(prefers-reduced-motion: reduce)');
let nItems=2,runId=0,gap=0,lvl='Slow',types,items=[],score,spawned,done,running,paused,last;
let hits,wrongs,misses,pipState,roundOver=false;
const TOTAL=10;
function say(text){$('live').textContent=text;}
function helpText(){
  const rule=nItems===4
    ?'Things drift down. Each side shows two. Choose the side with the lowest one.'
    :'Things drift down. Choose the side with the lowest one.';
  return rule+' Ten in a round.';
}
function help(){if(!roundOver)$('help').textContent=helpText();}
function choice(label,on){
  const b=document.createElement('button');
  b.type='button';b.textContent=label;b.setAttribute('aria-pressed',on?'true':'false');
  if(on)b.className='on';
  return b;
}
function nUI(){const d=$('nsel');d.replaceChildren();[2,4].forEach(k=>{const b=choice(k+' items',k===nItems);b.onclick=()=>{nItems=k;nUI();help()};d.appendChild(b)})}
function lvUI(){const d=$('lv');d.replaceChildren();Object.keys(LEVELS).forEach(k=>{const b=choice(k,k===lvl);b.onclick=()=>{lvl=k;lvUI()};d.appendChild(b)})}
function glyphsFor(side){return nItems===4?types.slice(side*2,side*2+2):[types[side]];}
function paintSide(side){
  const glyphs=glyphsFor(side);
  const el=side?$('iR'):$('iL');
  el.replaceChildren(...glyphs.map(ch=>{const s=document.createElement('span');s.textContent=ch;return s}));
  (side?$('bR'):$('bL')).setAttribute('aria-label',(side?'Right':'Left')+', '+glyphs.join(', '));
}
function fallTime(){return LEVELS[lvl]*(calm.matches?1.6:1);}
function pipUI(){
  const d=$('pips');d.replaceChildren();
  for(let i=0;i<TOTAL;i++){const s=document.createElement('i');s.className=pipState[i]||'pending';d.appendChild(s)}
  d.setAttribute('aria-label',done+' of '+TOTAL+' answered');
}
function upd(){$('score').textContent=score;pipUI();}
function start(){
  const st=$('stage');
  items.forEach(i=>i.el.remove());
  st.querySelectorAll('.pop').forEach(el=>el.remove());
  let pi;do{pi=Math.floor(Math.random()*PAIRS.length)}while(pi===lastPair);lastPair=pi;const g=PAIRS[pi];
  types=nItems===4?g.slice():[g[Math.random()<.5?0:1],g[Math.random()<.5?2:3]];
  if(Math.random()<.5)types.reverse();
  paintSide(0);paintSide(1);
  items=[];score=0;spawned=0;done=0;hits=0;wrongs=0;misses=0;pipState=[];
  paused=false;roundOver=false;const id=++runId;gap=0;running=true;last=performance.now();
  $('score').classList.remove('down');
  $('hold').hidden=true;$('pause').hidden=false;$('pause').textContent='Pause';$('pause').setAttribute('aria-pressed','false');
  $('mode').hidden=false;$('mode').textContent=nItems+' · '+lvl;$('pips').hidden=false;
  document.body.classList.add('playing');
  $('overlay').style.display='none';upd();
  requestAnimationFrame(t=>loop(t,id));
}
function loop(t,id){
  if(!running||id!==runId)return;
  if(paused){last=t;requestAnimationFrame(t2=>loop(t2,id));return}
  const st=$('stage'),H=st.clientHeight,size=Math.max(56,Math.min(110,st.clientWidth/6.5)),end=H-size-6,speed=end/fallTime();
  const dt=(t-last)/1000;last=t;
  if(spawned<TOTAL&&items.length<3&&(!items.length||items[items.length-1].y>=gap)){
    gap=(110+Math.random()*40)*size/64;
    const type=Math.floor(Math.random()*nItems);
    const el=document.createElement('div');el.className='item';el.style.fontSize=size+'px';el.textContent=types[type];el.style.top='0px';st.appendChild(el);
    items.push({el,type,y:0});spawned++;
  }
  items.forEach(i=>{i.y+=speed*dt;i.el.style.top=i.y+'px'});
  while(running&&items.length&&items[0].y>=end)remove(items[0],0,'miss');
  if(running&&id===runId)requestAnimationFrame(t2=>loop(t2,id));
}
function popAt(it,kind){
  const el=document.createElement('div');
  el.className='pop '+kind;
  el.textContent=kind==='hit'?'+10':kind==='bad'?'Wrong':'Miss';
  el.style.top=Math.max(8,it.y)+'px';
  $('stage').appendChild(el);
  setTimeout(()=>el.remove(),1100);
}
function remove(it,delta,kind){
  popAt(it,kind);
  it.el.remove();
  const i=items.indexOf(it);if(i>=0)items.splice(i,1);
  if(kind==='hit')hits++;else if(kind==='bad')wrongs++;else misses++;
  pipState[done]=kind;
  score+=delta;done++;
  if(delta<0||score<0)$('score').classList.add('down');
  else if(delta>0&&score>=0)$('score').classList.remove('down');
  upd();
  if(done>=TOTAL)finish();
  else say((kind==='hit'?'Correct. Plus 10. ':kind==='bad'?'Wrong. ':'Missed. ')+done+' of '+TOTAL+'. Score '+score+'.');
}
function flash(b,ok){
  b.classList.remove('ok','no');b.classList.add(ok?'ok':'no');
  clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('ok','no'),400);
}
function press(side){
  if(!running||paused||!items.length)return;
  const it=items[0];
  const ok=(nItems===4?Math.floor(it.type/2):it.type)===side;
  flash(side?$('bR'):$('bL'),ok);
  remove(it,ok?10:0,ok?'hit':'bad');
}
function setPause(on){
  if(!running)return;
  paused=on;
  $('hold').hidden=!on;
  $('pause').textContent=on?'Continue':'Pause';
  $('pause').setAttribute('aria-pressed',on?'true':'false');
  say(on?'Paused':'Resumed');
  if(!on)last=performance.now();
}
function finish(){
  running=false;paused=false;roundOver=true;
  document.body.classList.remove('playing');
  $('hold').hidden=true;$('pause').hidden=true;
  $('big').textContent=score+' points';
  $('help').textContent=hits+' right, '+wrongs+' wrong, '+misses+' missed';
  $('go').textContent='Once more';
  $('overlay').style.display='flex';
  say('Round over. '+$('help').textContent+'. Score '+score+'.');
}
$('go').onclick=start;
$('pause').onclick=()=>setPause(!paused);
$('resume').onclick=()=>setPause(false);
$('bL').onclick=()=>press(0);$('bR').onclick=()=>press(1);
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('fall'))return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();press(e.key==='ArrowRight'?1:0)}
  else if(e.key==='Escape'&&running)setPause(!paused);
});
let stopMem=()=>{},enterMem=()=>{};
function leaveFall(){
  runId++;running=false;paused=false;
  document.body.classList.remove('playing');
  $('hold').hidden=true;$('pause').hidden=true;
  if($('overlay').style.display==='none'){
    $('big').textContent='Falling Items';
    $('go').textContent='Start';
    roundOver=false;help();
    $('overlay').style.display='flex';
    $('mode').hidden=true;$('pips').hidden=true;
    $('score').textContent='0';$('score').classList.remove('down');
  }
}
function showPick(){
  stopMem();leaveFall();
  document.body.classList.remove('fall','mem','playing');
  document.body.classList.add('pick');
  document.title='Choose a game';
}
function showFall(){
  stopMem();
  document.body.classList.remove('pick','mem');
  document.body.classList.add('fall');
  document.title='Falling Items';
}
function showMem(){
  leaveFall();
  document.body.classList.remove('pick','fall','playing');
  document.body.classList.add('mem');
  document.title='Memory';
  enterMem();
}
$('games').onclick=showPick;
$('pickFall').onclick=showFall;
$('pickMem').onclick=showMem;
nUI();lvUI();help();
(()=>{
const SHOW_MS=3000,NEXT_MS=2000;
const LEVELS=[{n:3,k:2,rounds:4},{n:4,k:4,rounds:5}];
const total=()=>LEVELS[level].rounds;
const grid=$('mem-grid'),msg=$('mem-msg');
const startBtn=$('mem-start'),nextBtn=$('mem-next');
let level=0,round=0,score=0,targets=[],found=[],canTap=false,cells=[];
let tick,waitShow,waitAfter,advTimer,ovTimer;
function buildGrid(){
  const n=LEVELS[level].n;
  grid.replaceChildren();cells=[];
  grid.style.gridTemplateColumns='repeat('+n+',1fr)';
  grid.className=n>3?'big':'';
  for(let i=0;i<n*n;i++){
    const b=document.createElement('button');
    b.type='button';b.className='c';b.setAttribute('aria-label','Square '+(i+1));
    b.onclick=()=>tap(i);grid.appendChild(b);cells.push(b);
  }
}
function reset(){cells.forEach(c=>c.className='c');}
function setInfo(){
  $('mem-level').textContent='Level '+(level+1);
  $('mem-round').textContent='Round '+round+'/'+total();
  $('mem-score').textContent='Score: '+score;
}
function closeOverlay(){$('mem-overlay').classList.remove('show');clearTimeout(ovTimer);}
stopMem=function(){
  clearInterval(tick);clearTimeout(waitShow);clearTimeout(waitAfter);clearTimeout(advTimer);clearTimeout(ovTimer);
  canTap=false;$('mem-timer').style.display='none';closeOverlay();
};
function startLevel(){
  round=0;score=0;buildGrid();
  $('mem-final').textContent='';
  $('mem-trophy').style.display='none';
  newRound();
}
function newRound(){
  round++;setInfo();reset();found=[];canTap=false;
  const {n,k}=LEVELS[level];
  const idx=[...Array(n*n).keys()].sort(()=>Math.random()-.5);
  targets=idx.slice(0,k);
  msg.textContent='Watch the lit squares.';
  clearTimeout(waitShow);
  waitShow=setTimeout(()=>{
    targets.forEach(i=>cells[i].classList.add('lit'));
    const timer=$('mem-timer');
    let left=Math.round(SHOW_MS/1000);
    timer.textContent=left;timer.style.display='flex';
    clearInterval(tick);
    tick=setInterval(()=>{
      left--;
      if(left>0){timer.textContent=left;return;}
      clearInterval(tick);timer.style.display='none';
      reset();msg.textContent='Tap the ones you remember.';canTap=true;
    },1000);
  },500);
}
function tap(i){
  if(!canTap||found.includes(i))return;
  if(targets.includes(i)){
    found.push(i);cells[i].classList.add('ok');
    if(found.length===targets.length){canTap=false;score+=10;setInfo();msg.textContent='That’s it. Plus 10.';after();}
  }else{
    canTap=false;cells[i].classList.add('bad');
    targets.forEach(t=>cells[t].classList.add('ok'));
    msg.textContent='Not that one.';after();
  }
}
function after(){
  clearTimeout(waitAfter);
  if(round>=total())waitAfter=setTimeout(finish,NEXT_MS);
  else waitAfter=setTimeout(newRound,NEXT_MS);
}
function finish(){
  reset();
  const perfect=score===total()*10,hasNext=level<LEVELS.length-1;
  msg.textContent=perfect?'You remembered them all.':'That’s the round.';
  let t='Final score: '+score+' / '+(total()*10);
  if(perfect&&!hasNext){t+='\nEvery level is done.';$('mem-trophy').style.display='block';celebrate();}
  const f=$('mem-final');
  f.style.whiteSpace='pre-line';f.textContent=t;
  startBtn.textContent='Once more';startBtn.classList.toggle('alt',perfect&&hasNext);startBtn.hidden=false;
  nextBtn.hidden=!(perfect&&hasNext);
  clearTimeout(advTimer);
  if(perfect&&hasNext){
    msg.textContent='Level '+(level+1)+' is done.';
    f.textContent+='\nLevel '+(level+2)+' begins in a moment.';
    advTimer=setTimeout(goNext,4000);
  }
}
function goNext(){clearTimeout(advTimer);level++;startBtn.hidden=true;nextBtn.hidden=true;startLevel();}
function celebrate(){
  const ov=$('mem-overlay');
  ov.querySelectorAll('.conf').forEach(e=>e.remove());
  ov.classList.add('show');
  clearTimeout(ovTimer);ovTimer=setTimeout(closeOverlay,4000);
}
enterMem=function(){
  stopMem();
  level=0;round=0;score=0;
  $('mem-final').textContent='';
  $('mem-trophy').style.display='none';
  startBtn.hidden=false;startBtn.textContent='Start';startBtn.classList.remove('alt');
  nextBtn.hidden=true;
  msg.textContent='When you’re ready.';
  buildGrid();setInfo();
};
$('mem-overlay').onclick=closeOverlay;
startBtn.onclick=()=>{clearTimeout(advTimer);startBtn.hidden=true;nextBtn.hidden=true;startLevel();};
nextBtn.onclick=goNext;
$('mem-games').onclick=showPick;
})();
</script></body></html>
